  /system/diagnostics:
    get:
      tags:
        - System
      summary: Get read-only AI and system diagnostics report
      description: Returns a comprehensive, recursively sanitized 5-block diagnostics report (Universal Diagnostics Schema v1.0) including service metadata, redacted configuration, subsystem health checks, digital twin state, live RulesEngine decision traces, semantic time-series curve summaries, and heating ramp accept/reject traces.
      operationId: getSystemDiagnostics
      parameters:
        - in: query
          name: device
          required: false
          schema:
            type: string
            example: "15282 0905546"
          description: Optional device AIN (e.g. '15282 0905546'), software group ID ('group-1' or '1'), or case-insensitive room/device display name (e.g. 'Wohnzimmer') to restrict time-series and ramp analysis. Group names automatically expand to the group and its member AINs.
        - in: query
          name: range
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d, 90d, 180d, 365d, 1y, all]
            default: 24h
          description: Time window for semantic curve summary and heating ramp analysis.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
          description: Maximum number of recent error and journal log lines to include (1..200).
      responses:
        '200':
          description: Sanitized system diagnostics report generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: "System diagnostics report generated"
                  data:
                    $ref: '#/components/schemas/DiagnosticsReport'
        '400':
          description: Invalid range query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests - rate limit or brute-force lockout exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

