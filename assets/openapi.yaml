  /history:
    get:
      tags:
        - History
      summary: Get historical time-series data
      description: Returns raw historical data for a specific device in a column-oriented format (array of arrays), optimized for low bandwidth, rapid JSON parsing, and differential offline-first synchronization.
      operationId: getHistory
      parameters:
        - in: query
          name: device
          required: true
          schema:
            type: string
            example: "15282 0905546"
          description: The AIN of the device, 'WEATHER_01' for outdoor weather history, or a software group ID ('group-1' / 'group-{id}') for aggregated room group history and efficiency.
        - in: query
          name: since
          required: false
          schema:
            type: integer
            example: 1728669600
          description: UNIX timestamp (seconds or milliseconds). If provided, only data points recorded after this timestamp are returned (differential offline-first sync).
        - in: query
          name: range
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d, 90d, 180d, 365d, 1y, all]
            default: 24h
            example: 30d
          description: Time range to fetch when 'since' is omitted (24h, 7d, 30d, 90d, 180d, 365d, 1y, all). Defaults to 24h.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 5000
            example: 5000
          description: Maximum number of data points to return (0 = unlimited, up to 100000). Defaults to 5000.
      responses:
        '200':
          description: Historical time-series data in column-oriented format
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: "Historical data retrieved"
                  data:
                    type: object
                    properties:
                      device:
                        type: string
                        example: "15282 0905546"
                        description: The device AIN
                      device_type:
                        type: string
                        example: thermostat
                        description: Standardized device type
                      columns:
                        type: array
                        items:
                          type: string
                        example: ["timestamp", "temperature_current", "temperature_target", "humidity", "battery_level", "window_open", "temperature_hardware", "hardware_target_temperature", "humidity_guard_active", "preheat_active"]
                        description: Order and names of metrics present in each row of 'points'
                      points:
                        type: array
                        items:
                          type: array
                          items:
                            type: number
                        example:
                          - [1728669600, 21.5, 22.0, 52.0, 90, 0, 22.5, 22.0, 0, 0]
                          - [1728670500, 21.6, 22.0, 52.0, 90, 0, 22.6, 22.0, 0, 0]
                        description: Array of point rows matching the column structure
                      count:
                        type: integer
                        example: 2
                        description: Number of returned data points
                      efficiency:
                        nullable: true
                        description: Thermal Heating Efficiency Score for the requested thermostat/group and time window (only present for thermostat / thermostat_group)
                        allOf:
                          - $ref: '#/components/schemas/HeatingEfficiency'
                      heating_forecast:
                        nullable: true
                        description: 5-Day Heating Outlook for the requested thermostat/group (only present for thermostat / thermostat_group; also embedded inside efficiency)
                        allOf:
                          - $ref: '#/components/schemas/HeatingForecast'
                      energy_summary:
                        nullable: true
                        description: Smart Energy consumption (today, 7d, 30d, 365d) and cost projection for the requested smart switch or software group containing switches
                        allOf:
                          - $ref: '#/components/schemas/EnergySummary'
        '400':
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests - rate limit or brute-force lockout exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable - database service not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

