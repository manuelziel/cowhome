                        type: boolean
                        example: false
                        description: True if the feature update was ignored due to a stale client_timestamp (Last-Write-Wins)
        '400':
          description: Validation error or invalid feature configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Automation feature not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - device is managed by a software group (Single Authority lock)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests - rate limit or brute-force lockout exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable - database service not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /docs:
    get:
      tags:
        - Documentation
      summary: Interactive Swagger UI
      description: "Serves the zero-secret interactive Swagger UI HTML shell with an in-page Bearer token gate (`sessionStorage`). Any legacy `?api_key=` query parameters are scrubbed from the URL bar via `history.replaceState` without being accepted as credentials (RFC 6750). Actual OpenAPI specification loading (`/api/v1/openapi.yaml`) and API execution authenticate strictly via `Authorization: Bearer` or `X-API-Key` HTTP headers."
      operationId: getDocsUI
      security: []
      responses:
        '200':
          description: Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string
        '401':
          description: Unauthorized - missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests - rate limit or brute-force lockout exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /openapi.yaml:
    get:
      tags:
        - Documentation
      summary: OpenAPI 3.0 YAML specification
      description: "Returns the raw OpenAPI 3.0.3 YAML specification document. Requires a valid API key in HTTP headers (`Authorization: Bearer`, `Authorization: ApiKey`, or `X-API-Key` per RFC 6750)."
      operationId: getOpenAPISpec
      responses:
        '200':
          description: OpenAPI YAML specification
          content:
            application/yaml:
              schema:
                type: string
        '401':
          description: Unauthorized - missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Specification file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests - rate limit or brute-force lockout exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
