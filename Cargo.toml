[package]
name = "cowhome"
version = "0.0.2"
edition = "2024"
rust-version = "1.100"
authors = ["Manuel Ziel"]
description = "Autonomous single-binary Smart Home Hub for the FritzBox ecosystem (AHA & TR-064)"
license = "MIT"
readme = "README.md"

[dependencies]
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
md-5 = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "0.8", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
